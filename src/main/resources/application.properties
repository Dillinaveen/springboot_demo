

spring.application.name=banking-fraud-detection

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banking_fraud_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Fraud detection
app.fraud.max-transaction-amount=100000
app.fraud.max-transactions-per-minute=5

# Actuator
management.endpoints.web.exposure.include=health,info

# OAuth client configuration (if your authorization server uses it)
app.oauth.client-secret=${OAUTH_CLIENT_SECRET:change-this-secret}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=PT1H